<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripSync - Smart Travel Planner</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Plan your perfect trip with TripSync - Timeline view, calendar integration, interactive maps, and budget tracking">
    <meta name="author" content="Julie Yingst">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    
    <!-- External Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
    
    <style>
        /* Landing Page Styles */
        .landing-hero {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 2rem;
        }
        
        .hero-content h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .hero-content p {
            font-size: 1.25rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .hero-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .hero-buttons button {
            padding: 1rem 2rem;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .hero-buttons button:hover {
            transform: translateY(-2px);
        }
        
        .btn-get-started {
            background: white;
            color: #667eea;
            font-weight: bold;
        }
        
        /* Modal Styles */
        .auth-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        
        .auth-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .auth-modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            position: relative;
        }
        
        .auth-modal-close {
            position: absolute;
            right: 1rem;
            top: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }
        
        .auth-modal h2 {
            margin-bottom: 1.5rem;
            color: #333;
        }
        
        .auth-form-group {
            margin-bottom: 1rem;
        }
        
        .auth-form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
        }
        
        .auth-form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }
        
        .auth-form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .auth-submit {
            width: 100%;
            padding: 0.75rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
        }
        
        .auth-submit:hover {
            background: #5a67d8;
        }
        
        .auth-divider {
            text-align: center;
            margin: 1.5rem 0;
            color: #999;
        }
        
        .google-signin {
            width: 100%;
            padding: 0.75rem;
            background: white;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .google-signin:hover {
            background: #f8f8f8;
        }
        
        .auth-switch {
            text-align: center;
            margin-top: 1rem;
            color: #666;
        }
        
        .auth-switch a {
            color: #667eea;
            cursor: pointer;
            text-decoration: none;
        }
        
        .auth-switch a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Landing Page -->
    <div class="landing-hero">
        <div class="hero-content">
            <h1><i class="fas fa-map-marked-alt"></i> TripSync</h1>
            <p>Your Smart Travel Companion</p>
            <p>Plan, organize, and track your perfect trips with timeline views, interactive maps, and budget tracking</p>
            <div class="hero-buttons">
                <button class="btn-get-started" onclick="showLogin()">Get Started</button>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="auth-modal">
        <div class="auth-modal-content">
            <span class="auth-modal-close" onclick="hideLogin()">&times;</span>
            <h2>Welcome Back</h2>
            <form onsubmit="login(event); return false;">
                <div class="auth-form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="auth-form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="auth-submit">Login</button>
            </form>
            <div class="auth-divider">OR</div>
            <button class="google-signin" onclick="googleSignIn()">
                <i class="fab fa-google"></i> Sign in with Google
            </button>
            <div class="auth-switch">
                Don't have an account? <a onclick="showSignup()">Sign up</a>
            </div>
        </div>
    </div>

    <!-- Signup Modal -->
    <div id="signupModal" class="auth-modal">
        <div class="auth-modal-content">
            <span class="auth-modal-close" onclick="hideSignup()">&times;</span>
            <h2>Create Account</h2>
            <form onsubmit="signup(event); return false;">
                <div class="auth-form-group">
                    <label for="signupName">Name</label>
                    <input type="text" id="signupName" required>
                </div>
                <div class="auth-form-group">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" required>
                </div>
                <div class="auth-form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" required minlength="6">
                </div>
                <div class="auth-form-group">
                    <label for="signupConfirmPassword">Confirm Password</label>
                    <input type="password" id="signupConfirmPassword" required minlength="6">
                </div>
                <button type="submit" class="auth-submit">Sign Up</button>
            </form>
            <div class="auth-divider">OR</div>
            <button class="google-signin" onclick="googleSignIn()">
                <i class="fab fa-google"></i> Sign up with Google
            </button>
            <div class="auth-switch">
                Already have an account? <a onclick="showLogin()">Login</a>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-storage-compat.js"></script>

    <!-- Main Application Scripts -->
    <script src="firebase-config.js"></script>
    <script src="js/auth.js"></script>
    
    <script>
        // Check if user is already logged in
        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('userToken')) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
