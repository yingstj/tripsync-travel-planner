<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Circular background with subtle shadow -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Modern compass/location design -->
  <g transform="translate(100, 100)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="white" stroke-width="3" opacity="0.3"/>
    
    <!-- Inner compass points -->
    <g stroke="white" stroke-width="3" fill="none">
      <!-- Vertical line -->
      <line x1="0" y1="-35" x2="0" y2="-20" stroke-linecap="round"/>
      <line x1="0" y1="20" x2="0" y2="35" stroke-linecap="round"/>
      <!-- Horizontal line -->
      <line x1="-35" y1="0" x2="-20" y2="0" stroke-linecap="round"/>
      <line x1="20" y1="0" x2="35" y2="0" stroke-linecap="round"/>
    </g>
    
    <!-- Center location pin -->
    <g transform="scale(1.2)">
      <path d="M 0 -15 C -8 -15 -15 -8 -15 0 C -15 5 -10 10 0 20 C 10 10 15 5 15 0 C 15 -8 8 -15 0 -15 Z" 
            fill="white" />
      <circle cx="0" cy="-2" r="5" fill="url(#grad1)"/>
    </g>
    
    <!-- Orbit dots suggesting movement/sync -->
    <g fill="white">
      <circle cx="0" cy="-60" r="3" opacity="0.6"/>
      <circle cx="42" cy="42" r="3" opacity="0.4"/>
      <circle cx="-60" cy="0" r="3" opacity="0.5"/>
    </g>
  </g>
</svg>
