<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripSync - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand"><i class="fas fa-map-marked-alt"></i><span>TripSync</span></div>
            <ul class="nav-menu">
                <li><a href="#dashboard" class="nav-link active" data-view="dashboard">Dashboard</a></li>
                <li><a href="#planner" class="nav-link" data-view="planner">Planner</a></li>
                <li><a href="#profile" class="nav-link" data-view="profile">Profile</a></li>
            </ul>
            <div class="nav-actions">
                <button class="btn-primary" id="newTrip"><i class="fas fa-plus"></i> New Trip</button>
                <button class="btn-secondary" id="logoutButton"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <section id="dashboard" class="view-section active">
            <div class="dashboard-header"><h1>My Trips</h1></div>
            <div class="trips-grid" id="tripsGrid"></div>
        </section>

        <section id="planner" class="view-section">
             <div class="planner-header"><h1 id="plannerTripName"></h1></div>
             <div class="planner-grid">
                 <div class="planner-suggestions-panel">
                     <h2>Suggestions</h2>
                     <div id="pointsOfInterestContainer" class="poi-container"></div>
                     <hr>
                     <h2>Custom Activity</h2>
                     <form id="customActivityForm" class="modal-form">
                         <div class="form-group"><label for="customActivityName">Activity Name</label><input type="text" id="customActivityName" required></div>
                         <div class="form-group"><label for="customActivityLocation">Location (optional)</label><input type="text" id="customActivityLocation" placeholder="e.g., Eiffel Tower"></div>
                         <button type="submit" class="btn-primary">Add to Itinerary</button>
                     </form>
                 </div>
                 <div class="planner-timeline-panel">
                     <h2>Itinerary</h2>
                     <div class="unscheduled-activities">
                         <h3>Unscheduled</h3>
                         <div id="unscheduledItems" class="timeline-items unscheduled-drop-zone" ondragover="event.preventDefault()" ondrop="handleDrop(event)" data-date="null"></div>
                     </div>
                     <div id="plannerTimelineContainer"></div>
                 </div>
             </div>
        </section>

        <section id="profile" class="view-section">
             <div class="profile-header"><h1>My Profile</h1></div>
             <div class="profile-grid">
                 <div class="profile-form-panel">
                     <h2>Profile Information</h2>
                     <form id="profileForm">
                         <div class="form-group"><label for="userName">Username</label><input type="text" id="userName" name="userName" required></div>
                         <div class="form-group"><label for="userEmail">Email</label><input type="email" id="userEmail" name="userEmail" disabled></div>
                         <button type="submit" class="btn-primary">Save Profile</button>
                     </form>
                 </div>
                 <div class="profile-preferences-panel">
                     <h2>Travel Preferences</h2>
                     <form id="preferencesForm">
                         <div class="form-group"><label for="favoriteAirlines">Favorite Airlines</label><input type="text" id="favoriteAirlines"></div>
                         <div class="form-group"><label for="favoriteHotels">Favorite Hotel Chains</label><input type="text" id="favoriteHotels"></div>
                         <div class="form-group"><label for="travelStyle">Travel Style</label><select id="travelStyle"><option value="any">Any</option><option value="beach">Beach/Relaxation</option><option value="outdoors">Hiking/Outdoors</option><option value="sightseeing">Sightseeing</option></select></div>
                         <button type="submit" class="btn-primary">Save Preferences</button>
                     </form>
                 </div>
                 <div class="profile-bucket-list-panel">
                     <h2>My Bucket List</h2>
                     <form id="bucketListForm">
                         <div class="form-group"><label for="bucketListItem">Add a place</label><input type="text" id="bucketListItem" placeholder="e.g., Tokyo, Japan"></div>
                         <button type="submit" class="btn-secondary">Add</button>
                     </form>
                     <ul id="bucketList" class="bucket-list"></ul>
                 </div>
             </div>
        </section>
    </main>

    <div class="modal" id="newTripModal">
        <div class="modal-content">
            <div class="modal-header"><h3>Create New Trip</h3><button class="modal-close" data-modal="newTripModal">&times;</button></div>
            <form id="newTripForm" class="modal-form">
                <div class="form-group"><label for="tripName">Trip Name *</label><input type="text" id="tripName" required></div>
                <div class="form-group">
                    <label>Destinations *</label>
                    <div id="destinationInputsContainer">
                        <div class="destination-input-group"><input type="text" class="destination-input" placeholder="Enter destination" required><button type="button" class="btn-icon remove-destination-btn" style="display:none;"><i class="fas fa-times-circle"></i></button></div>
                    </div>
                    <button type="button" class="btn-secondary" id="addDestinationBtn"><i class="fas fa-plus"></i> Add Destination</button>
                    <small id="destination-error" class="error-message" style="display: none;">Please select a valid location from the dropdown.</small>
                </div>
                <div class="form-row">
                    <div class="form-group"><label for="startDate">Start Date *</label><input type="date" id="startDate" required></div>
                    <div class="form-group"><label for="endDate">End Date *</label><input type="date" id="endDate" required></div>
                </div>
                <div class="form-group checkbox-group"><input type="checkbox" id="isTentative"><label for="isTentative">Tentative Dates</label></div>
                <div class="form-actions"><button type="button" class="btn-secondary" data-modal="newTripModal">Cancel</button><button type="submit" class="btn-primary">Create Trip</button></div>
            </form>
        </div>
    </div>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-storage-compat.js"></script>
    
    <!-- Google Maps API -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDHfXBVIXa50808Lg2ZoEA6tl4nwYCs8KY&libraries=places&callback=initMapScript"></script>

    <!-- Application Scripts -->
    <script src="firebase-config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script> 
    <script src="js/trips.js"></script>
    <script src="js/activities.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
